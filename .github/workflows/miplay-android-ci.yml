name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & unit test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MiPlayDiscovery

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Wrapper permissions
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon :miplay-sender:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :miplay-discovery-test:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miplay-demo-debug-apk
          path: MiPlayDiscovery/miplay-discovery-test/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: MiPlayDiscovery/miplay-sender/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
