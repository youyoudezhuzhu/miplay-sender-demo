name: Release APK

# Builds a signed release APK and attaches it to a GitHub Release.
#
# Signing: if the repository secrets RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD
# / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD are present, the APK is signed with that
# keystore. Otherwise the build falls back to the standard Android debug keystore,
# which is fine for sideloading but NOT for Play distribution.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Wrapper permissions
        run: chmod +x ./gradlew
        working-directory: MiPlayDiscovery

      - name: Unit tests
        run: ./gradlew --no-daemon :miplay-sender:testDebugUnitTest
        working-directory: MiPlayDiscovery

      - name: Decode release keystore (optional)
        id: keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No RELEASE_KEYSTORE_BASE64 secret; signing with the debug keystore."
          fi

      - name: Assemble release APK (custom keystore)
        if: steps.keystore.outputs.have_keystore == 'true'
        working-directory: MiPlayDiscovery
        env:
          MIPLAY_KEYSTORE: ${{ runner.temp }}/release.jks
          MIPLAY_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MIPLAY_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MIPLAY_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :miplay-discovery-test:assembleRelease

      - name: Assemble release APK (debug keystore fallback)
        if: steps.keystore.outputs.have_keystore != 'true'
        working-directory: MiPlayDiscovery
        run: |
          ./gradlew --no-daemon :miplay-discovery-test:assembleDebug
          mkdir -p miplay-discovery-test/build/outputs/apk/release
          cp miplay-discovery-test/build/outputs/apk/debug/*.apk \
             miplay-discovery-test/build/outputs/apk/release/

      - name: Collect artifact
        id: apk
        working-directory: MiPlayDiscovery
        run: |
          set -e
          SRC=$(find miplay-discovery-test/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::no release APK produced"; exit 1
          fi
          TAG="${{ steps.meta.outputs.tag }}"
          OUT="miplay-demo-${TAG}.apk"
          cp "$SRC" "$OUT"
          echo "path=MiPlayDiscovery/$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MiPlay 妙播 Demo ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            MiPlay 妙播 sender demo — discovery + multi-select + control channel.

            Built from `MiPlayDiscovery/`. See `MiPlayDiscovery/DEMO_README.md`
            for what this build does and does not yet implement.

            The APK is signed with the debug keystore unless release signing
            secrets are configured, so uninstall any previous copy before
            installing.
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
