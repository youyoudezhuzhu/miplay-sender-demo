plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fusionplay.miplay.test'
    compileSdk 34

    defaultConfig {
        applicationId "com.fusionplay.miplay.discovery.test"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
    }

    // Optional release signing: supplied via environment variables by CI, so no
    // secrets live in the repository. Without them the release build stays
    // unsigned and CI falls back to the debug APK.
    def ksPath = System.getenv('MIPLAY_KEYSTORE')
    if (ksPath != null && file(ksPath).exists()) {
        signingConfigs {
            release {
                storeFile file(ksPath)
                storePassword System.getenv('MIPLAY_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MIPLAY_KEY_ALIAS')
                keyPassword System.getenv('MIPLAY_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Built-in debug keystore, so the APK installs directly.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksPath != null && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(':miplay-discovery')
    implementation project(':miplay-sender')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
}
